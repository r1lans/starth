<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Моё расписание — TheStarth</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400;600&family=Fraunces:opsz,wght@9..144,600..900&display=swap" rel="stylesheet">
    <style>
        main.tsched-main { max-width: 700px; margin: 0 auto; padding: 7rem 1.5rem 4rem; }
        main.tsched-main h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
        main.tsched-main .sub { color: var(--ink-soft); margin-bottom: 2.5rem; }
        .lesson-card {
            background: var(--paper); border: 1px solid var(--rule); border-radius: 12px;
            padding: 1.5rem; margin-bottom: 1rem; display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 0.75rem;
        }
        .lesson-card strong { display: block; font-family: var(--font-heading); }
        .lesson-card .sub2 { color: var(--ink-soft); font-size: 0.85rem; margin-top: 0.25rem; }
        .empty-state { color: var(--ink-soft); text-align: center; padding: 3rem 0; }
        #not-found { display: none; text-align: center; padding: 5rem 0; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" style="text-decoration: none;">
                <div class="logo" style="display: flex; align-items: center; gap: 12px; letter-spacing: normal;">
                    <span class="site-logo-icon"><svg width="45" height="45" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <g transform="translate(50, 50) rotate(45) translate(-50, -50)">
                            <rect x="25" y="25" width="50" height="50" fill="none" stroke="#D4AF37" stroke-width="4"/>
                            <rect x="20" y="20" width="10" height="10" fill="#1A1A1A" stroke="#D4AF37" stroke-width="3"/>
                            <rect x="70" y="20" width="10" height="10" fill="#1A1A1A" stroke="#D4AF37" stroke-width="3"/>
                            <rect x="20" y="70" width="10" height="10" fill="#1A1A1A" stroke="#D4AF37" stroke-width="3"/>
                            <rect x="70" y="70" width="10" height="10" fill="#1A1A1A" stroke="#D4AF37" stroke-width="3"/>
                        </g>
                    </svg></span>
                    <div style="display: flex; flex-direction: column; justify-content: center; transform: translateY(2px);">
                        <span style="font-family: 'Dancing Script', cursive; font-size: 2.2rem; line-height: 0.85; color: var(--ink); font-weight: 700; letter-spacing: 0;">TheStarth</span>
                        <span style="font-family: 'Inter', sans-serif; font-size: 0.55rem; letter-spacing: 2px; color: var(--ink-soft); text-transform: uppercase; margin-top: 4px;">Start with the best.</span>
                    </div>
                </div>
            </a>
        </div>
    </nav>

    <main class="tsched-main">
        <div id="tsched-content">
            <h1>Расписание: <span class="text-premium" id="t-name">—</span></h1>
            <p class="sub">Ближайшие уроки. Ссылка на звонок появляется прямо здесь — куда-то ещё заходить не нужно.</p>
            <div id="t-lessons"><div class="empty-state">Загрузка…</div></div>
        </div>
        <div id="not-found">
            <h1>Ссылка недействительна</h1>
            <p style="color: var(--ink-soft); margin-top: 1rem;">Обратитесь к администратору TheStarth за правильной ссылкой.</p>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        const TEACHER_NAMES = {
            firdavs: 'Убайдуллоев Фирдавс', sadokat: 'Убайдуллоева Садокат', javokhir: 'Солиев Жавохир',
            behruz: 'Соатбоев Бехруз', azizbek: 'Елмуратов Азизбек'
        };

        const params = new URLSearchParams(window.location.search);
        const teacherId = params.get('id');

        (async function () {
            if (!teacherId || !TEACHER_NAMES[teacherId]) {
                document.getElementById('tsched-content').style.display = 'none';
                document.getElementById('not-found').style.display = 'block';
                return;
            }
            document.getElementById('t-name').textContent = TEACHER_NAMES[teacherId];

            const wrap = document.getElementById('t-lessons');
            if (typeof FIREBASE_READY === 'undefined' || !FIREBASE_READY) {
                wrap.innerHTML = '<div class="empty-state">Расписание скоро заработает здесь.</div>';
                return;
            }
            try {
                const today = new Date().toISOString().slice(0, 10);
                const snap = await db.collection('schedule')
                    .where('teacherId', '==', teacherId)
                    .where('date', '>=', today)
                    .orderBy('date').orderBy('time').get();
                if (snap.empty) {
                    wrap.innerHTML = '<div class="empty-state">Пока нет запланированных уроков.</div>';
                    return;
                }
                wrap.innerHTML = '';
                snap.forEach(doc => {
                    const s = doc.data();
                    const card = document.createElement('div');
                    card.className = 'lesson-card';
                    card.innerHTML = `
                        <div>
                            <strong>${new Date(s.date).toLocaleDateString('ru-RU', {weekday:'long', day:'numeric', month:'long'})}, ${s.time}</strong>
                            <div class="sub2">Ученик: @${s.studentNickname}${s.subject ? ' · ' + s.subject : ''}</div>
                        </div>
                        <a href="video-lesson.html?room=${s.room}" class="btn-primary">Войти на урок</a>
                    `;
                    wrap.appendChild(card);
                });
            } catch (err) {
                wrap.innerHTML = '<div class="empty-state">Не удалось загрузить расписание.</div>';
                console.warn(err);
            }
        })();
    </script>
</body>
</html>
